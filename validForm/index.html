<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="container-md">
        <form class="mb-3 ">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" id="Name" placeholder="Name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="Email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" id="Message" rows="3"></textarea>
            </div>
            <div class="mb-3" style="display: flex; flex-direction: column;">
                <label class="form-label" style="color: red;" id="errorMessage"></label>
                <button type="submit" class="btn btn-primary mb-3 confirm-btn">Отправить</button>
            </div>
        </form>
    </div>
</body>
<script>

    function validateForm() {
        let NameEl = document.querySelector("#Name");
        let EmailEl = document.querySelector("#Email");
        let MessageEl = document.querySelector("#Message");

        let Name = NameEl.value;
        let Email = EmailEl.value;
        let Message = MessageEl.value;

        return {
            Name,
            Email,
            Message
        }
    }

    let btn = document.querySelector(".confirm-btn");
    btn.addEventListener("click", async (e) => {
        e.preventDefault();
        document.querySelector("#errorMessage").textContent = "";

        let data;
        try {
            data = validateForm();
        }catch(err) {
            document.querySelector("#errorMessage").textContent = err;
            return;
        }

        let response = await fetch('/api/savedata.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json;charset=utf-8' },
        body: JSON.stringify(data)
        });
        let result = await response.json();
        
        if( response.status === 200 )
        {
            let MessageEl = document.querySelector("#Message");
            btn.style.backgroundColor = "#0a0";
            let prevText = btn.textContent;
            btn.textContent = "Отправлено";
            MessageEl.value = "";

            setTimeout(() => {
                btn.style.backgroundColor = null;
                btn.textContent = prevText;
                
            }, 1000);
        }else {
            document.querySelector("#errorMessage").textContent = result.message;
        }
    })
</script>
</html>
